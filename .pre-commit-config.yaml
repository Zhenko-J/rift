# Install: pre-commit install && pre-commit install --hook-type pre-push
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (secrets + generic privacy patterns)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        files: ^server/
      - id: ruff-format
        files: ^server/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      - id: private-terms
        name: private terms (maintainer regex, file kept outside the repository)
        entry: pwsh -NoProfile -File tools/check_private_terms.ps1
        language: system
        pass_filenames: true
        stages: [pre-commit, pre-push]
