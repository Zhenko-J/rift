name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    env:
      # Secrets cannot appear in an `if:`; the step below tests this variable instead (empty on forks).
      PRIVATE_TERMS_REGEX: ${{ secrets.PRIVATE_TERMS_REGEX }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (secrets + generic privacy patterns)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: clean-room guard (ADR-011) — no pyRevit code used
        # Tool names of the pyRevit MCP extension (MIT) are cited on purpose in the registry's `origin` field (ADR-027,
        # THIRD_PARTY.md); what is forbidden is using pyRevit code: importing it or referencing its assemblies.
        run: |
          if git grep -n -i -E '^\s*(import|from)\s+pyrevit\b|pyRevitLabs|Include="pyRevit' -- addin server shared ':!*.md'; then
            echo "::error::pyRevit code used in source (clean-room, ADR-011)"; exit 1
          fi
      - name: private terms (maintainer regex kept in a secret; skipped on forks)
        if: ${{ env.PRIVATE_TERMS_REGEX != '' }}
        run: |
          if git grep -I -n -E "$PRIVATE_TERMS_REGEX" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::private term found"; exit 1
          fi

  server:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: sync
        run: uv sync --all-extras
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: pytest
        run: uv run pytest -q
      - name: schemas, permissions and generated tool listings are up to date
        run: uv run rift-mcp schemas --check && uv run rift-mcp permissions --check && uv run rift-mcp tools --check && uv run python ../tools/gen_pamphlet.py --check

  addin:
    runs-on: windows-latest
    strategy:
      matrix:
        revit: ["26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: addin/global.json
      - name: restore
        run: dotnet restore addin/rift.sln
      - name: build (no Revit installed — reference packages only)
        run: dotnet build addin/rift.sln -c "Release R${{ matrix.revit }}" --no-restore
      - name: test
        run: dotnet test addin/tests/Rift.Tests -c "Release R${{ matrix.revit }}" --no-build --logger trx
      - name: verify staged hashes (SHA256SUMS.txt covers every staged file, ADR-022)
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify_sha256sums.ps1 -Folder "addin/dist/20${{ matrix.revit }}/rift"
      - name: staged add-in
        uses: actions/upload-artifact@v4
        with:
          name: rift-addin-20${{ matrix.revit }}
          path: addin/dist/20${{ matrix.revit }}
          retention-days: 14

  changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md touched
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if git diff --quiet origin/${{ github.base_ref }}...HEAD -- CHANGELOG.md; then
            echo "::error::add a line under Unreleased in CHANGELOG.md (or label the PR no-changelog)"; exit 1
          fi
