[project]
name = "rift-mcp"
version = "0.0.1"
description = "MCP server for Autodesk Revit — local, HMAC-authenticated, with model-level guard rails"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Zhenko-J" }]
keywords = ["mcp", "revit", "bim", "add-in"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp>=1.29,<2",
  "pydantic>=2.9",
  "psutil>=6.0",
  "parso>=0.8.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "anyio>=4"]

[project.scripts]
rift-mcp = "rift_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rift_mcp"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
